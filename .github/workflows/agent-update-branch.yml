name: Agent Update Branch (reusable)

on:
  workflow_call:
    inputs:
      pr_number: { required: true, type: number }
      branch: { required: true, type: string }
      branch_head_sha: { required: true, type: string }
      base_ref: { required: true, type: string }
      install_command: { required: false, type: string, default: "npm ci" }
      build_command: { required: false, type: string, default: "npm run build" }
      node_version: { required: false, type: string, default: "22" }
      model: { required: false, type: string, default: "claude-sonnet-5-5" }
      effort: { required: false, type: string, default: "medium" }
      timeout_minutes: { required: false, type: number, default: 60 }
      extra_allowed_domains: { required: false, type: string, default: "" }
      agent_provider: { required: false, type: string, default: "claude" }
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: { required: false }
      ANTHROPIC_API_KEY: { required: false }
      OPENAI_API_KEY: { required: false }

jobs:
  update-branch:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.AGENT_TIMEOUT_MINUTES || inputs.timeout_minutes) }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      BRANCH: ${{ inputs.branch }}
      BASE_REF: ${{ inputs.base_ref }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Transition labels
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:update-branch" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Validate agent_provider
        env:
          AGENT_PROVIDER: ${{ inputs.agent_provider }}
        run: |
          case "$AGENT_PROVIDER" in
            claude|codex) ;;
            *)
              echo "::error::agent_provider must be 'claude' or 'codex', got '$AGENT_PROVIDER'"
              exit 1
              ;;
          esac

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_head_sha }}
          fetch-depth: 0

      - name: Set git identity
        # The runner has no git author, so the agent's commit fails. Commit as the App's bot user.
        run: |
          bot_id=$(gh api "users/protocortex%5Bbot%5D" --jq .id 2>/dev/null || echo "")
          git config --global user.name "protocortex[bot]"
          git config --global user.email "${bot_id:+${bot_id}+}protocortex[bot]@users.noreply.github.com"

      - name: Switch to the PR branch
        # The checkout is detached at the PR head, so the agent has no branch to push. Name it.
        run: git switch -C "$BRANCH"

      - name: Detect Node project
        id: node
        # The stubs default to npm commands. A repo without a package.json (Rust, Python, ...) has
        # nothing to install, so skip Node setup instead of failing on `npm ci`.
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::No package.json, skipping Node setup and dependency install."; fi

      - name: Setup Node.js
        if: steps.node.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies
        if: steps.node.outputs.present == 'true'
        run: ${{ inputs.install_command }}

      - name: Build prompt
        id: prompt
        run: |
          cat <<'PROMPT_BLOCK' >> "$GITHUB_OUTPUT"
          text<<PROMPT_EOF
          REPO: ${{ github.repository }}
          PR NUMBER: ${{ inputs.pr_number }}
          BASE BRANCH: ${{ inputs.base_ref }}

          This PR's branch is out of date or conflicting with `${{ inputs.base_ref }}`. Fetch and
          merge `origin/${{ inputs.base_ref }}` into the current branch (merge, not rebase, since
          this branch may already be pushed and reviewed). Resolve any conflicts using the
          intent of both sides, run this repo's build (`${{ inputs.build_command }}`) and test
          command afterward, then commit and push. You are on the branch `${{ inputs.branch }}`,
          push it with `git push origin ${{ inputs.branch }}`.

          If a conflict is ambiguous (both sides changed the same logic meaningfully), stop and
          post a PR comment explaining the conflict instead of guessing which side should win.
          PROMPT_EOF
          PROMPT_BLOCK

      - name: Update branch agent (Claude)
        id: agent
        if: inputs.agent_provider == 'claude'
        uses: protocortex/agent-workflows/.github/actions/run-claude-agent@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: ${{ vars.AGENT_UPDATE_BRANCH_MODEL || vars.AGENT_MODEL || inputs.model }}
          effort: ${{ vars.AGENT_UPDATE_BRANCH_EFFORT || vars.AGENT_EFFORT || inputs.effort }}
          max_turns: "25"
          allowed_tools: "Read,Write,Edit,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*),Bash(git fetch:*),Bash(git merge:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(npm run:*),Bash(npm test:*),Bash(cargo build:*),Bash(cargo test:*),Bash(cargo check:*),Bash(cargo clippy:*),Bash(cargo fmt:*),Bash(go build:*),Bash(go test:*),Bash(go vet:*),Bash(make:*),Bash(just:*),Bash(pytest:*),Bash(python -m pytest:*),Bash(python3 -m pytest:*),Bash(gh pr comment:*)"
          extra_allowed_domains: ${{ vars.AGENT_EXTRA_ALLOWED_DOMAINS || inputs.extra_allowed_domains }}
          prompt: ${{ steps.prompt.outputs.text }}

      - name: Update branch agent (Codex)
        if: inputs.agent_provider == 'codex'
        uses: protocortex/agent-workflows/.github/actions/run-codex-agent@v1
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ vars.AGENT_UPDATE_BRANCH_MODEL || vars.AGENT_MODEL || inputs.model }}
          max_turns: "25"
          extra_allowed_domains: ${{ vars.AGENT_EXTRA_ALLOWED_DOMAINS || inputs.extra_allowed_domains }}
          prompt: ${{ steps.prompt.outputs.text }}

      - name: Check the branch is up to date
        # The CLI exits 0 even when the agent gives up (a denied command, an ambiguous conflict), so
        # check the result: the pushed branch must contain the base branch.
        if: inputs.agent_provider == 'claude' && success()
        env:
          RESULT_FILE: ${{ steps.agent.outputs.result_file }}
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          git fetch origin "$BASE_REF" "$BRANCH"
          if ! git merge-base --is-ancestor "origin/$BASE_REF" "origin/$BRANCH"; then
            echo "::error::origin/$BRANCH does not contain origin/$BASE_REF after the agent ran. Its reply was:"
            cat "$RESULT_FILE"
            exit 1
          fi

      - name: Mark blocked on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          gh pr comment "$PR_NUMBER" --body "\`agent:update-branch\` run failed. Check the [workflow run]($RUN_URL). Re-add \`agent:update-branch\` to retry."

      - name: Always remove in-progress
        if: always()
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
