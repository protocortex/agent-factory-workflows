name: "Run Claude Agent (hardened)"
description: >
  Runs the Claude Code CLI directly (installed via npm, not
  anthropics/claude-code-action@v1) with a fixed sandbox + credential-masking
  baseline shared by every agent-factory stage. Every stage's untrusted input
  (issue title/body, PR content) flows into `prompt`, so this exists to make
  the leakage defenses apply everywhere by construction, instead of being
  copy-pasted five times and drifting. Runs the CLI directly rather than the
  vendor action because that action requires installing Anthropic's Claude
  GitHub App on the target repo, for either an OAuth token or a plain API
  key; the CLI itself has no such requirement for either credential type,
  same as run-codex-agent has none for its own.

inputs:
  prompt:
    description: "Full prompt for this stage, including any untrusted issue/PR content."
    required: true
  allowed_tools:
    description: "--allowedTools value, stage-specific. This is the per-stage scoping; the sandbox/credential rules below are the same for every stage regardless of this value."
    required: true
  model:
    required: false
    default: "claude-opus-4-8"
  max_turns:
    description: "Accepted for interface parity with existing workflow calls. Not forwarded: the installed CLI has no turn-count flag, see max_cost_usd for the real guard."
    required: false
    default: "30"
  max_cost_usd:
    description: "--max-budget-usd value: hard-stops the run once this dollar amount of API spend is reached."
    required: false
    default: "5"
  claude_code_oauth_token:
    description: >
      OAuth access token from `claude setup-token` (Pro/Max subscription auth,
      no separate API billing). Either this or anthropic_api_key is required;
      the CLI reads whichever is set, no GitHub App installation needed for
      either.
    required: false
  anthropic_api_key:
    description: "Plain Anthropic API key. Either this or claude_code_oauth_token is required."
    required: false
  github_token:
    description: "Token used for gh/git operations Claude runs. Never exposed in plaintext to Claude's sandboxed Bash, see credentials.envVars below. Runs against api.github.com only."
    required: false
  extra_allowed_domains:
    description: >
      Comma-separated list of additional domains the sandboxed Bash tool may reach,
      on top of the baseline (GitHub + the common public package registries below).
      Use this for a private registry (Artifactory, a company npm/PyPI mirror,
      GitHub Packages under a different host, etc.) or any registry not already
      covered. Wildcards allowed (e.g. "*.mycompany-registry.internal").
    required: false
    default: ""

outputs:
  conclusion:
    description: "'success' or 'failure', from the CLI process's own exit status."
    value: ${{ steps.run.conclusion }}

runs:
  using: "composite"
  steps:
    - name: Install Claude Code CLI
      shell: bash
      run: npm install --global @anthropic-ai/claude-code@2.1.283

    - name: Build sandbox settings
      id: settings
      shell: bash
      env:
        EXTRA_DOMAINS: ${{ inputs.extra_allowed_domains }}
      run: |
        # Common package registries plus GitHub. EXTRA_DOMAINS extends this per-stage.
        baseline='[
          "github.com", "*.github.com", "api.github.com", "*.githubusercontent.com",
          "registry.npmjs.org", "*.npmjs.org",
          "pypi.org", "files.pythonhosted.org",
          "crates.io", "static.crates.io", "index.crates.io",
          "rubygems.org", "*.rubygems.org",
          "repo.maven.apache.org", "repo1.maven.org", "*.gradle.org",
          "api.nuget.org", "*.nuget.org",
          "proxy.golang.org", "sum.golang.org",
          "*.pkg.github.com"
        ]'

        extra_json="[]"
        if [ -n "$EXTRA_DOMAINS" ]; then
          extra_json=$(echo "$EXTRA_DOMAINS" | tr ',' '\n' | sed '/^\s*$/d' | sed 's/^ *//; s/ *$//' | jq -R . | jq -s .)
        fi

        domains=$(jq -c --argjson extra "$extra_json" '. + $extra | unique' <<< "$baseline")

        settings_dir=$(mktemp -d "${RUNNER_TEMP:-/tmp}/claude-settings-XXXXXX")
        settings_file="${settings_dir}/settings.json"

        # strictAllowlist denies a non-allowlisted domain outright instead of
        # prompting; a headless -p run has no TTY to answer a prompt, so
        # without this a disallowed request would just hang or error oddly.
        jq -n \
          --argjson domains "$domains" \
          '{
            sandbox: {
              enabled: true,
              network: { allowedDomains: $domains, strictAllowlist: true },
              credentials: {
                envVars: [
                  { name: "GH_TOKEN", mode: "mask", injectHosts: ["api.github.com"] },
                  { name: "GITHUB_TOKEN", mode: "mask", injectHosts: ["api.github.com"] },
                  { name: "AGENT_PAT", mode: "deny" },
                  { name: "ANTHROPIC_API_KEY", mode: "deny" },
                  { name: "CLAUDE_CODE_OAUTH_TOKEN", mode: "deny" }
                ]
              }
            }
          }' > "$settings_file"

        echo "settings_file=${settings_file}" >> "$GITHUB_OUTPUT"

    - name: Write prompt to file
      id: prompt
      shell: bash
      env:
        # Passed as an env var, never spliced into the script body: the
        # prompt carries untrusted issue/PR content, and GitHub Actions
        # expands ${{ }} expressions before the shell runs, so inlining it
        # directly into a heredoc would let a crafted value break out of the
        # delimiter or inject shell syntax. printf with an env var has no
        # such expansion step.
        RAW_PROMPT: ${{ inputs.prompt }}
      run: |
        prompt_dir=$(mktemp -d "${RUNNER_TEMP:-/tmp}/claude-prompt-XXXXXX")
        prompt_file="${prompt_dir}/prompt.txt"
        printf '%s' "$RAW_PROMPT" > "$prompt_file"
        echo "prompt_file=${prompt_file}" >> "$GITHUB_OUTPUT"

    - name: Validate a Claude credential was given
      shell: bash
      env:
        HAS_OAUTH: ${{ inputs.claude_code_oauth_token != '' }}
        HAS_API_KEY: ${{ inputs.anthropic_api_key != '' }}
      run: |
        if [ "$HAS_OAUTH" != "true" ] && [ "$HAS_API_KEY" != "true" ]; then
          echo "::error::run-claude-agent needs either claude_code_oauth_token or anthropic_api_key; neither was provided." >&2
          exit 1
        fi

    - name: Run Claude Code (sandboxed, credentials masked)
      id: run
      shell: bash
      env:
        # Only one of these is ever expected to be non-empty (install.sh
        # itself refuses to configure both secrets on the same repo); the
        # CLI's own precedence, ANTHROPIC_API_KEY wins if both are set, only
        # matters if that guard was bypassed.
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GH_TOKEN: ${{ inputs.github_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        CLAUDE_MODEL: ${{ inputs.model }}
        CLAUDE_ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        CLAUDE_MAX_COST_USD: ${{ inputs.max_cost_usd }}
        SETTINGS_FILE: ${{ steps.settings.outputs.settings_file }}
        PROMPT_FILE: ${{ steps.prompt.outputs.prompt_file }}
      run: |
        claude -p \
          --model "$CLAUDE_MODEL" \
          --allowedTools "$CLAUDE_ALLOWED_TOOLS" \
          --settings "$SETTINGS_FILE" \
          --output-format json \
          --max-budget-usd "$CLAUDE_MAX_COST_USD" \
          < "$PROMPT_FILE"
